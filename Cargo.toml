[package]
name = "justone"
version = "0.2.0"
authors = ["Ben Ruijl <benruyl@gmail.com>"]
repository = "https://github.com/benruijl/justone"
keywords = ["game", "web"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "A web version of Just One"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.9"

[profile.release]
opt-level = "s"
lto = true
